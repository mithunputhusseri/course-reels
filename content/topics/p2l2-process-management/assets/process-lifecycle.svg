<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Five-state process lifecycle">
  <rect width="420" height="300" fill="#f7f4ef"/>
  <text x="210" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">Process lifecycle (5 states)</text>

  <!-- New -->
  <rect x="24" y="50" width="80" height="44" rx="22" fill="#eeeae3" stroke="#7a7268" stroke-width="2"/>
  <text x="64" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">New</text>

  <!-- Ready -->
  <rect x="160" y="50" width="90" height="44" rx="22" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="205" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Ready</text>

  <!-- Running -->
  <rect x="310" y="50" width="90" height="44" rx="22" fill="#e4f0e8" stroke="#2f8f74" stroke-width="2"/>
  <text x="355" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Running</text>

  <!-- Waiting -->
  <rect x="160" y="160" width="90" height="44" rx="22" fill="#f3e8d8" stroke="#c47a3a" stroke-width="2"/>
  <text x="205" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Waiting</text>

  <!-- Terminated -->
  <rect x="310" y="160" width="90" height="44" rx="22" fill="#e8e4f0" stroke="#6b5b95" stroke-width="2"/>
  <text x="355" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1a2a33">Terminated</text>

  <!-- Arrows -->
  <path d="M104 72 H155" stroke="#5a6b73" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="120" y="64" font-family="system-ui,sans-serif" font-size="9" fill="#5a6b73">admit</text>

  <path d="M250 72 H305" stroke="#5a6b73" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="258" y="64" font-family="system-ui,sans-serif" font-size="9" fill="#5a6b73">dispatch</text>

  <path d="M355 94 V150" stroke="#5a6b73" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="362" y="128" font-family="system-ui,sans-serif" font-size="9" fill="#5a6b73">exit</text>

  <path d="M310 160 Q260 130 250 94" stroke="#c47a3a" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="248" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#c47a3a">I/O wait</text>

  <path d="M205 160 V100" stroke="#3d7ea6" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="140" y="138" font-family="system-ui,sans-serif" font-size="9" fill="#3d7ea6">I/O done</text>

  <path d="M310 60 Q275 40 250 60" stroke="#3d7ea6" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="255" y="42" font-family="system-ui,sans-serif" font-size="9" fill="#3d7ea6">preempt</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a6b73"/>
    </marker>
  </defs>

  <text x="210" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b73">Only Ready processes compete for the CPU</text>
  <text x="210" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a7268">Waiting = blocked on I/O or an event</text>
</svg>
