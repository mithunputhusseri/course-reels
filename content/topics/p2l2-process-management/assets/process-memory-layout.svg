<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Process memory layout">
  <rect width="360" height="420" fill="#f7f4ef"/>
  <text x="180" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a2a33">Virtual address space</text>
  <text x="180" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">Vmax (high) to V0 (low)</text>

  <rect x="70" y="62" width="220" height="58" rx="8" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="180" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2a33">Stack</text>
  <text x="180" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d7ea6">frames / locals - grows down</text>

  <rect x="70" y="128" width="220" height="36" rx="6" fill="#eeeae3" stroke="#c8c2b8" stroke-dasharray="4 3"/>
  <text x="180" y="151" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a7268">unmapped gap</text>

  <rect x="70" y="172" width="220" height="58" rx="8" fill="#e4f0e8" stroke="#2f8f74" stroke-width="2"/>
  <text x="180" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2a33">Heap</text>
  <text x="180" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2f8f74">malloc - grows up</text>

  <rect x="70" y="238" width="220" height="50" rx="8" fill="#f3e8d8" stroke="#c47a3a" stroke-width="2"/>
  <text x="180" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2a33">Data</text>
  <text x="180" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c47a3a">globals / static vars</text>

  <rect x="70" y="296" width="220" height="50" rx="8" fill="#e8e4f0" stroke="#6b5b95" stroke-width="2"/>
  <text x="180" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2a33">Text</text>
  <text x="180" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b5b95">machine code (R/X)</text>

  <text x="40" y="90" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b73">Vmax</text>
  <text x="48" y="330" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b73">V0</text>
  <line x1="55" y1="70" x2="55" y2="340" stroke="#5a6b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="2" fill="#5a6b73"/>
    </marker>
  </defs>
  <text x="180" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b73">Stack and heap grow toward each other</text>
</svg>
