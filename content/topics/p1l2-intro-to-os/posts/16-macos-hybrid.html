<h3>macOS: Mach + BSD hybrid</h3>
<p>macOS (historically Mac OS X) mixes a <strong>Mach-based</strong> kernel environment with a <strong>BSD Unix</strong> layer, plus frameworks above for apps and UI.</p>

  <strong>Hybrid reality:</strong> Mach roots look microkernel-like, but many BSD services sit in-kernel for performance.
