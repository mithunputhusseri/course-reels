<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-label="Readers-writers state encoding">
  <rect width="440" height="240" fill="#f7f4ef"/>
  <text x="220" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">Readers/writers: one integer</text>

  <rect x="30" y="50" width="120" height="80" rx="10" fill="#e8f0e4" stroke="#2f8f74" stroke-width="2"/>
  <text x="90" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#2f8f74">i &gt; 0</text>
  <text x="90" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a2a33"># of readers</text>

  <rect x="160" y="50" width="120" height="80" rx="10" fill="#eeeae3" stroke="#7a7268" stroke-width="2"/>
  <text x="220" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#5a6b73">i = 0</text>
  <text x="220" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a2a33">idle</text>

  <rect x="290" y="50" width="120" height="80" rx="10" fill="#f3e8d8" stroke="#c47a3a" stroke-width="2"/>
  <text x="350" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#c47a3a">i = -1</text>
  <text x="350" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a2a33">one writer</text>

  <text x="220" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a2a33">ReleaseExclusive -&gt; Broadcast (many readers may enter)</text>
  <text x="220" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a2a33">ReleaseShared (last) -&gt; Signal (one writer can enter)</text>
  <text x="220" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">Overlapping readers can starve writers - add writeWaiters if needed</text>
</svg>
