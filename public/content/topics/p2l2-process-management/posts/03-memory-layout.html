<span class="kicker">Address space</span>
<h3>What a process looks like in memory</h3>
<p>The OS abstraction for process state is the <strong>address space</strong> — virtual addresses from <strong>V0</strong> to <strong>Vmax</strong>.</p>
<img src="__BASE__content/topics/p2l2-process-management/assets/process-memory-layout.svg" alt="Process address space: stack at high addresses, then gap, heap, data, and text at low addresses" />
<div class="callout">
  <strong>Picture:</strong> stack grows down from high addresses; heap grows up from low — they meet in the middle if both expand.
</div>
