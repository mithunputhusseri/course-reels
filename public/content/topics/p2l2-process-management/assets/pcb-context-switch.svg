<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="PCB used during context switch">
  <rect width="420" height="280" fill="#f7f4ef"/>
  <text x="210" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">Context switch via PCBs</text>

  <!-- CPU -->
  <rect x="160" y="44" width="100" height="70" rx="10" fill="#1a2a33"/>
  <text x="210" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">CPU</text>
  <text x="210" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#b8d4e8">PC · regs · SP</text>

  <!-- PCB P1 -->
  <rect x="24" y="150" width="150" height="90" rx="10" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="99" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">PCB · P1</text>
  <text x="99" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d7ea6">saved state</text>
  <text x="99" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#5a6b73">PC, regs, SP&</text>

  <!-- PCB P2 -->
  <rect x="246" y="150" width="150" height="90" rx="10" fill="#e4f0e8" stroke="#2f8f74" stroke-width="2"/>
  <text x="321" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">PCB · P2</text>
  <text x="321" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2f8f74">saved state</text>
  <text x="321" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#5a6b73">PC, regs, SP&</text>

  <!-- Save arrow -->
  <path d="M175 120 L99 145" stroke="#c47a3a" stroke-width="2.5" fill="none"/>
  <text x="105" y="130" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#c47a3a">1. save</text>

  <!-- Restore arrow -->
  <path d="M321 145 L245 120" stroke="#2f8f74" stroke-width="2.5" fill="none"/>
  <text x="268" y="130" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2f8f74">2. restore</text>

  <text x="210" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b73">Save current ’ pick next ’ restore next</text>
</svg>
