<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Process creation tree">
  <rect width="420" height="260" fill="#f7f4ef"/>
  <text x="210" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">Process tree</text>

  <!-- init -->
  <rect x="160" y="44" width="100" height="36" rx="8" fill="#1a2a33"/>
  <text x="210" y="67" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">init / systemd</text>

  <!-- shell -->
  <rect x="160" y="110" width="100" height="36" rx="8" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="210" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">shell</text>

  <!-- children -->
  <rect x="40" y="190" width="80" height="36" rx="8" fill="#e4f0e8" stroke="#2f8f74" stroke-width="2"/>
  <text x="80" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#1a2a33">ls</text>

  <rect x="170" y="190" width="80" height="36" rx="8" fill="#e4f0e8" stroke="#2f8f74" stroke-width="2"/>
  <text x="210" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#1a2a33">vim</text>

  <rect x="300" y="190" width="80" height="36" rx="8" fill="#f3e8d8" stroke="#c47a3a" stroke-width="2"/>
  <text x="340" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1a2a33">browser</text>

  <!-- lines -->
  <line x1="210" y1="80" x2="210" y2="110" stroke="#5a6b73" stroke-width="1.8"/>
  <line x1="210" y1="146" x2="210" y2="170" stroke="#5a6b73" stroke-width="1.8"/>
  <line x1="80" y1="170" x2="340" y2="170" stroke="#5a6b73" stroke-width="1.8"/>
  <line x1="80" y1="170" x2="80" y2="190" stroke="#5a6b73" stroke-width="1.8"/>
  <line x1="210" y1="170" x2="210" y2="190" stroke="#5a6b73" stroke-width="1.8"/>
  <line x1="340" y1="170" x2="340" y2="190" stroke="#5a6b73" stroke-width="1.8"/>

  <text x="210" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">Parent creates children; Android uses Zygote</text>
</svg>
