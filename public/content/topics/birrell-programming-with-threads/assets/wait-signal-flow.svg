<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="Condition variable Wait and Signal flow">
  <rect width="460" height="300" fill="#f7f4ef"/>
  <text x="230" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">Wait / Signal dance</text>

  <!-- Consumer -->
  <rect x="20" y="48" width="190" height="200" rx="10" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="115" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Consumer</text>
  <text x="30" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">1. LOCK m</text>
  <text x="30" y="118" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">2. list empty?</text>
  <text x="30" y="138" font-family="system-ui,sans-serif" font-size="11" fill="#c47a3a">3. Wait(m, c)</text>
  <text x="42" y="156" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b73">’ unlock + sleep</text>
  <text x="30" y="180" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">4. wake ’ re-lock m</text>
  <text x="30" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#2f8f74">5. WHILE: recheck!</text>
  <text x="30" y="220" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">6. take item, unlock</text>

  <!-- Producer -->
  <rect x="250" y="48" width="190" height="200" rx="10" fill="#e8f0e4" stroke="#2f8f74" stroke-width="2"/>
  <text x="345" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Producer</text>
  <text x="260" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">1. LOCK m</text>
  <text x="260" y="118" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">2. enqueue item</text>
  <text x="260" y="138" font-family="system-ui,sans-serif" font-size="11" fill="#2f8f74">3. Signal(c)</text>
  <text x="272" y="156" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b73">’ wake e1 waiter</text>
  <text x="260" y="180" font-family="system-ui,sans-serif" font-size="11" fill="#1a2a33">4. unlock m</text>
  <text x="260" y="210" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">(or Signal after</text>
  <text x="260" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">unlock  often better)</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c47a3a"/>
    </marker>
  </defs>
  <path d="M210 145 H248" stroke="#c47a3a" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="230" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c47a3a">hint</text>

  <text x="230" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b73">Signal is a hint  always recheck the predicate in a WHILE</text>
</svg>
