<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-label="Threads share one address space">
  <rect width="440" height="280" fill="#f7f4ef"/>
  <text x="220" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a2a33">One address space, many threads</text>

  <rect x="40" y="48" width="360" height="70" rx="8" fill="#e8f0e4" stroke="#2f8f74" stroke-width="2"/>
  <text x="220" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2a33">Shared globals / heap</text>
  <text x="220" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">off-stack memory - all threads can read and write</text>

  <rect x="40" y="140" width="100" height="90" rx="8" fill="#dceaf2" stroke="#3d7ea6" stroke-width="2"/>
  <text x="90" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1a2a33">Thread A</text>
  <text x="90" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own PC</text>
  <text x="90" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own stack</text>

  <rect x="170" y="140" width="100" height="90" rx="8" fill="#f3e8d8" stroke="#c47a3a" stroke-width="2"/>
  <text x="220" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1a2a33">Thread B</text>
  <text x="220" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own PC</text>
  <text x="220" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own stack</text>

  <rect x="300" y="140" width="100" height="90" rx="8" fill="#eeeae3" stroke="#7a7268" stroke-width="2"/>
  <text x="350" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1a2a33">Thread C</text>
  <text x="350" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own PC</text>
  <text x="350" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b73">own stack</text>

  <text x="220" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b73">process = 1 flow to 1 address space; thread = flow inside shared space</text>
</svg>
