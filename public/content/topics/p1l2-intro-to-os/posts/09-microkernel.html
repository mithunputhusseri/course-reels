<span class="kicker">Microkernel</span>
<h3>Tiny kernel, user-level servers</h3>
<p>Only the most fundamental services stay in the kernel. File systems, device drivers, databases, and similar services run as <strong>user-level servers</strong>. Apps talk to them via IPC; the tiny core mediates hardware.</p>
<img src="__BASE__content/topics/p1l2-intro-to-os/assets/microkernel.png" alt="Microkernel: apps and servers in user space, minimal OS core over hardware" />
<div class="callout">
  <strong>Examples:</strong> Mach, QNX, MINIX 3, L4-family kernels.
